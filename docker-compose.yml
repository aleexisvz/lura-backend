# Local PostgreSQL for running the test suite without Neon.
# Same image and credentials as .github/workflows/tests.yml.
#
#   docker compose up -d
#   DATABASE_URL_TEST=postgresql://postgres:postgres@localhost:5432/lura_test npx vitest run
#   docker compose down
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lura_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lura_test"]
      interval: 5s
      timeout: 5s
      retries: 10
