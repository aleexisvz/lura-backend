name: Test Suite

on:
  push:
  workflow_dispatch:

jobs:
  tests:
    name: Run tests (Vitest + Fastify inject + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lura
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lura"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lura?schema=public
      JWT_SECRET: github-actions-jwt-secret-12345
      JWT_EXPIRES_IN: 15m

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Run test suite
        run: npm test
