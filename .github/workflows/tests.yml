name: Test Suite

on:
  push:
  workflow_dispatch:

jobs:
  tests:
    name: Run tests (Vitest + Fastify inject + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lura_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lura_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lura_test?schema=public
      JWT_SECRET: github-actions-jwt-secret-12345
      JWT_EXPIRES_IN: 15m
      S3_ENDPOINT: https://mock-r2.cloudflarestorage.com
      S3_ACCESS_KEY: test-access-key
      S3_SECRET_KEY: test-secret-key
      S3_BUCKET_NAME: lura-test-bucket
      S3_PUBLIC_URL: https://cdn.test.lura.app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm run prisma:generate

      - name: Typecheck
        run: pnpm run typecheck

      - name: Run test suite
        run: pnpm test
